<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f0">
  <meta name="description" content="Explore an open collection of low-poly 3D landmarks. Find their locations on the map and inspect every model in an interactive viewer.">
  <title>Landmarks — Map &amp; 3D models</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./maplibre-gl.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="./">Landmarks</a>
    <a href="https://github.com/alexwohlbruck/landmarks">GitHub</a>
  </header>
  <main class="workspace">
    <aside class="collection" aria-label="Landmark collection">
      <div class="filters">
        <input id="search" type="search" placeholder="Search landmarks" aria-label="Search landmarks">
        <select id="region" aria-label="Filter by region"><option value="">All regions</option></select>
        <span id="result-count" role="status">Loading…</span>
      </div>
      <div id="results" class="results" aria-label="Search results"></div>
    </aside>
    <section class="map-section" aria-label="Landmark locations">
      <div id="map" role="region" aria-label="Interactive map of landmark locations"></div>
      <button id="reset-map" class="reset-map" type="button">Reset view</button>
      <div id="map-status" class="map-status" role="status">Loading map…</div>
    </section>
    <aside id="inspector" class="inspector" aria-label="Selected landmark preview">
      <h1 id="place-name">Choose a landmark</h1>
      <div class="viewer-wrap">
        <model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1.1" camera-orbit="-35deg 70deg auto" interaction-prompt="none" autoplay></model-viewer>
        <div id="model-status" class="model-status" role="status">Loading model…</div>
      </div>
      <div class="model-actions">
        <select id="lod" aria-label="Model detail" hidden><option value="low">Standard model</option><option value="detail">Detailed model</option></select>
        <a id="download" download>Download GLB</a>
        <p id="credit" class="credit"></p>
      </div>
    </aside>
  </main>
  <noscript><p class="fatal">Enable JavaScript to explore the map and 3D models. The <a href="./api/v1/latest.json">dataset API</a> is also available directly.</p></noscript>
</body>
</html>
